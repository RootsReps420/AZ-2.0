# Management stack: LAW, mgmt spoke, alerts. Requires connectivity (Hub01) first.
# envName=igmf seeds terraform.tfvars from the mgmt *.tfvars.example.

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}

stages:
  - stage: mgmt
    displayName: ${{ parameters.action }} ${{ parameters.envName }} — Hub management (LAW / spoke / alerts)
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          stackName: mgmt
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          seedIgmfTfvars: ${{ eq(parameters.envName, 'igmf') }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — management
          scopeManifest: |
            - Management resource group
            - Log Analytics workspace + DCE / Insights DCR
            - Action group + AVD / platform alerts
            - Optional alert UAMI + role assignments
            - Mgmt spoke (AgentsSubnet) → Hub01 + default-to-firewall UDR
            - (Agent VMSS stays PowerShell — not in this stack)
