# Parameterised Terraform release — one stack per run (catch-all).
# Prefer named pipelines (tf-Hub-Deployment.yml, etc.) for day-to-day.
# Deploy order: vwan → connectivity → mgmt → labs → avd
# envName=igmf seeds *.tfvars.example → terraform.tfvars (uksouth only; bank envs do not).

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: stackName
    displayName: Stack
    type: string
    default: connectivity
    values:
      - vwan
      - connectivity
      - mgmt
      - labs
      - avd
  - name: hubSelection
    displayName: Hubs (connectivity only)
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}
      location: ${{ parameters.location }}

stages:
  - ${{ if eq(parameters.stackName, 'connectivity') }}:
    - template: templates/connectivity-stages.yml
      parameters:
        envName: ${{ parameters.envName }}
        location: ${{ parameters.location }}
        azureServiceConnection: $(azureServiceConnection)
        agentPool: $(agentPool)
        tfBackendResourceGroup: $(tfBackendResourceGroup)
        tfBackendStorageAccount: $(tfBackendStorageAccount)
        tfBackendContainer: $(tfBackendContainer)
        action: ${{ parameters.action }}
        hubSelection: ${{ parameters.hubSelection }}
        seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}

  - ${{ if eq(parameters.stackName, 'vwan') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }}/vwan — Virtual WAN
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            location: ${{ parameters.location }}
            stackName: vwan
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/vwan
            seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — Virtual WAN
            scopeManifest: |
              - Shared Virtual WAN resource group
              - Virtual WAN (vdi platform)

  - ${{ if eq(parameters.stackName, 'mgmt') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }}/mgmt
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            location: ${{ parameters.location }}
            stackName: mgmt
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — management
            scopeManifest: |
              - Management resource group
              - Log Analytics workspace + DCE / Insights DCR
              - Action group + alerts
              - Mgmt spoke → Hub01

  - ${{ if eq(parameters.stackName, 'labs') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }}/labs
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            location: ${{ parameters.location }}
            stackName: labs
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD labs
            scopeManifest: |
              - PERS / MSH / PRIV lab spokes + hub connections
              - Optional FSLogix / lab Key Vaults / PERS blob (tfvars flags)

  - ${{ if eq(parameters.stackName, 'avd') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }}/avd
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            location: ${{ parameters.location }}
            stackName: avd
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD host pools
            scopeManifest: |
              - Host pools / workspaces / scaling plans
              - Gallery + image definitions
              - MSH DCRs (session hosts stay PowerShell)
