# Parameterised Terraform release — one stack per run (catch-all).
# Prefer named pipelines (tf-Hub-Deployment.yml, etc.) for day-to-day.
# Deploy order: _global → connectivity → mgmt → labs → avd
# SPNs / agents from docs/subscription-inventory.md

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
  - name: stackName
    displayName: Stack
    type: string
    default: connectivity
    values:
      - _global
      - connectivity
      - mgmt
      - labs
      - avd
  - name: hubSelection
    displayName: Hubs (connectivity only)
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: azureServiceConnection
    ${{ if eq(parameters.envName, 'int') }}:
      value: SC-R-VDI-INT-C-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: SC-P-VDI-PRD-C-01
  - name: agentPool
    ${{ if eq(parameters.envName, 'int') }}:
      value: uks-int-vdi-mgmt-vss-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: uks-prd-vdi-mgmt-vss-01
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate
  - name: stackWorkingDirectory
    ${{ if eq(parameters.stackName, '_global') }}:
      value: environments/_global
    ${{ else }}:
      value: environments/${{ parameters.envName }}/${{ parameters.stackName }}

stages:
  - ${{ if eq(parameters.stackName, 'connectivity') }}:
    - template: templates/connectivity-stages.yml
      parameters:
        envName: ${{ parameters.envName }}
        azureServiceConnection: $(azureServiceConnection)
        agentPool: $(agentPool)
        tfBackendResourceGroup: $(tfBackendResourceGroup)
        tfBackendStorageAccount: $(tfBackendStorageAccount)
        tfBackendContainer: $(tfBackendContainer)
        action: ${{ parameters.action }}
        hubSelection: ${{ parameters.hubSelection }}
        workingDirectory: $(stackWorkingDirectory)

  - ${{ if eq(parameters.stackName, '_global') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/_global — Virtual WAN
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            stackName: _global
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/_global
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — Virtual WAN
            scopeManifest: |
              - Shared Virtual WAN resource group
              - Virtual WAN (vdi platform)

  - ${{ if eq(parameters.stackName, 'mgmt') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/mgmt
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            stackName: mgmt
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: $(stackWorkingDirectory)
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — management
            scopeManifest: |
              - Management resource group
              - Log Analytics workspace + DCE / Insights DCR
              - Action group + alerts
              - Mgmt spoke → Hub01

  - ${{ if eq(parameters.stackName, 'labs') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/labs
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            stackName: labs
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: $(stackWorkingDirectory)
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — AVD labs
            scopeManifest: |
              - PERS / MSH / PRIV lab spokes + hub connections
              - Optional FSLogix / lab Key Vaults / PERS blob (tfvars flags)

  - ${{ if eq(parameters.stackName, 'avd') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} ${{ parameters.envName }}/avd
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: ${{ parameters.envName }}
            stackName: avd
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: $(stackWorkingDirectory)
            stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — AVD host pools
            scopeManifest: |
              - Host pools / workspaces / scaling plans
              - Gallery + image definitions
              - MSH DCRs (session hosts stay PowerShell)
