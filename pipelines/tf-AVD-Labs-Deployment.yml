# AVD lab spokes + storage (PERS / MSH / PRIV, FSLogix, lab KVs). Requires connectivity + mgmt.
# envName=igmf seeds terraform.tfvars from the labs *.tfvars.example (uksouth only).

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}
      location: ${{ parameters.location }}

stages:
  - stage: labs
    displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD labs (spokes / storage)
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          location: ${{ parameters.location }}
          stackName: labs
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD labs
          scopeManifest: |
            - PERS / MULT (/ PRIV) lab resource groups
            - PERS spokes → Hub01
            - MSH spokes → Hub01 + Hub02 dual-hub UDRs
            - Optional FSLogix storage accounts / shares / CMK (enable_fslogix)
            - Optional lab Key Vaults (enable_lab_keyvaults)
            - Optional PERS blob STAs (enable_pers_blob)
            - NSG rules as defined in the labs root
