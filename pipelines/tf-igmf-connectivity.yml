# IGMF sandbox convenience: connectivity with hubSelection.
# Prefer tf-igmf-release.yml (stackName=connectivity) or bank-style Hub pipeline pattern.
# Requires AzDo variable group: tf-backend-igmf

trigger: none

parameters:
  - name: hubSelection
    displayName: Hubs to manage
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - group: tf-backend-igmf
  - name: azureServiceConnection
    value: SC-IGMF-VDI-TF-01
  - name: agentPool
    value: Azure Pipelines
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate

stages:
  - template: templates/connectivity-stages.yml
    parameters:
      envName: igmf
      azureServiceConnection: $(azureServiceConnection)
      agentPool: $(agentPool)
      tfBackendResourceGroup: $(tfBackendResourceGroup)
      tfBackendStorageAccount: $(tfBackendStorageAccount)
      tfBackendContainer: $(tfBackendContainer)
      action: ${{ parameters.action }}
      hubSelection: ${{ parameters.hubSelection }}
      workingDirectory: environments/igmf/connectivity
      seedIgmfTfvars: true
