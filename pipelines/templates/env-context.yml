# Shared env + location → AzDo identity / backend mapping for named + catch-all pipelines.
# location=uksouth (default): bank int/prd private agents + SC; igmf hosted + tf-backend-igmf.
# location=italynorth|spaincentral: placeholder SC names (replace when regional labs exist);
#   hosted agents until regional private pools exist. Backend still uses tf.backend.* var names
#   — point those at a regional state SA when the lab is ready.

parameters:
  - name: envName
    type: string
  - name: location
    type: string
    default: uksouth

variables:
  - name: tfLocation
    value: ${{ parameters.location }}
  - ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'igmf')) }}:
      - group: tf-backend-igmf
  - name: azureServiceConnection
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'int')) }}:
      value: SC-R-VDI-INT-C-01
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'prd')) }}:
      value: SC-P-VDI-PRD-C-01
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'igmf')) }}:
      value: SC-IGMF-VDI-TF-01
    ${{ if ne(parameters.location, 'uksouth') }}:
      # TODO: replace with real regional service connection when lab exists
      value: TODO-${{ parameters.envName }}-${{ parameters.location }}-SC
  - name: agentPool
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'int')) }}:
      value: uks-int-vdi-mgmt-vss-01
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'prd')) }}:
      value: uks-prd-vdi-mgmt-vss-01
    ${{ if and(eq(parameters.location, 'uksouth'), eq(parameters.envName, 'igmf')) }}:
      value: Azure Pipelines
    ${{ if ne(parameters.location, 'uksouth') }}:
      value: Azure Pipelines
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate
