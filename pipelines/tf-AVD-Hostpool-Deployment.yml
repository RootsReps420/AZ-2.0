# AVD host pools, workspaces, scaling plans, gallery definitions, DCRs.
# Requires labs (+ connectivity / mgmt). Session-host VMs stay PowerShell.
# envName=igmf seeds terraform.tfvars from the avd *.tfvars.example (uksouth only).

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}
      location: ${{ parameters.location }}

stages:
  - stage: avd
    displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD host pools / gallery
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          location: ${{ parameters.location }}
          stackName: avd
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — AVD host pools
          scopeManifest: |
            - AVD resource group(s)
            - MSH host pools + workspace + scaling (+ decom siblings)
            - Optional PERS / PRIV host pools (feature flags in tfvars)
            - Compute gallery + image definitions (versions stay Packer)
            - MSH data collection rules
            - (Session-host VMs stay PowerShell — not in this stack)
