# Convenience: int connectivity with hubSelection. Prefer tf-Hub-Deployment.yml.
# Requires AzDo vars: tf.backend.resourceGroup, tf.backend.storageAccount (uksouth).
# location=italynorth|spaincentral uses placeholder SC from env-context.

trigger: none

parameters:
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: hubSelection
    displayName: Hubs to manage
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: int
      location: ${{ parameters.location }}

stages:
  - template: templates/connectivity-stages.yml
    parameters:
      envName: int
      location: ${{ parameters.location }}
      azureServiceConnection: $(azureServiceConnection)
      agentPool: $(agentPool)
      tfBackendResourceGroup: $(tfBackendResourceGroup)
      tfBackendStorageAccount: $(tfBackendStorageAccount)
      tfBackendContainer: $(tfBackendContainer)
      action: ${{ parameters.action }}
      hubSelection: ${{ parameters.hubSelection }}
