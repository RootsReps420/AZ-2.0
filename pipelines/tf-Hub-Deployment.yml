# Connectivity hubs (Hub01 secured / Hub02 unsecured + VPN). One connectivity state file.
# Requires _global (vWAN) first. hubSelection:
#   hub01 — firewall policy + Hub01 only
#   hub02 — add/keep Hub02 + VPN (keeps Hub01 enabled)
#   both  — Hub01 + Hub02 in one apply (phased first-time: run hub01 then hub02)
# envName=igmf seeds terraform.tfvars from the connectivity *.tfvars.example.

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: hubSelection
    displayName: Hubs to manage
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}

stages:
  - template: templates/connectivity-stages.yml
    parameters:
      envName: ${{ parameters.envName }}
      azureServiceConnection: $(azureServiceConnection)
      agentPool: $(agentPool)
      tfBackendResourceGroup: $(tfBackendResourceGroup)
      tfBackendStorageAccount: $(tfBackendStorageAccount)
      tfBackendContainer: $(tfBackendContainer)
      action: ${{ parameters.action }}
      hubSelection: ${{ parameters.hubSelection }}
      workingDirectory: environments/${{ parameters.envName }}/connectivity
      seedIgmfTfvars: ${{ eq(parameters.envName, 'igmf') }}
