# IGMF sandbox release — one stack per run into ignitemyfire.co.uk.
# Deploy order: _global → connectivity → mgmt → labs → avd.
# Hardcoded IGMF AzDo identity — do NOT use bank SC / private agent pools.
# Requires AzDo variable group: tf-backend-igmf

trigger: none

parameters:
  - name: stackName
    displayName: Stack
    type: string
    default: connectivity
    values:
      - _global
      - connectivity
      - mgmt
      - labs
      - avd
  - name: hubSelection
    displayName: Hubs (connectivity only)
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - group: tf-backend-igmf
  - name: envName
    value: igmf
  - name: azureServiceConnection
    value: SC-IGMF-VDI-TF-01
  - name: agentPool
    value: Azure Pipelines
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate
  - name: stackWorkingDirectory
    ${{ if eq(parameters.stackName, '_global') }}:
      value: environments/_global
    ${{ else }}:
      value: environments/igmf/${{ parameters.stackName }}

stages:
  - ${{ if eq(parameters.stackName, 'connectivity') }}:
    - template: templates/connectivity-stages.yml
      parameters:
        envName: igmf
        azureServiceConnection: $(azureServiceConnection)
        agentPool: $(agentPool)
        tfBackendResourceGroup: $(tfBackendResourceGroup)
        tfBackendStorageAccount: $(tfBackendStorageAccount)
        tfBackendContainer: $(tfBackendContainer)
        action: ${{ parameters.action }}
        hubSelection: ${{ parameters.hubSelection }}
        workingDirectory: environments/igmf/connectivity
        seedIgmfTfvars: true

  - ${{ if eq(parameters.stackName, '_global') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/_global — Virtual WAN
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            stackName: _global
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/_global
            seedIgmfTfvars: true
            stageLabel: ${{ parameters.action }} igmf — Virtual WAN
            scopeManifest: |
              - Shared Virtual WAN resource group
              - Virtual WAN (IGMF sandbox)

  - ${{ if eq(parameters.stackName, 'mgmt') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/mgmt
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            stackName: mgmt
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/igmf/mgmt
            seedIgmfTfvars: true
            stageLabel: ${{ parameters.action }} igmf — management
            scopeManifest: |
              - Management resource group
              - Log Analytics + mgmt spoke + alerts

  - ${{ if eq(parameters.stackName, 'labs') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/labs
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            stackName: labs
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/igmf/labs
            seedIgmfTfvars: true
            stageLabel: ${{ parameters.action }} igmf — AVD labs
            scopeManifest: |
              - Lab spokes + optional FSLogix / KVs / blob

  - ${{ if eq(parameters.stackName, 'avd') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/avd
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            stackName: avd
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/igmf/avd
            seedIgmfTfvars: true
            stageLabel: ${{ parameters.action }} igmf — AVD host pools
            scopeManifest: |
              - Host pools / gallery definitions / DCRs
