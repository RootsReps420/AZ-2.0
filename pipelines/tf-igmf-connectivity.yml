# IGMF sandbox convenience: connectivity with hubSelection.
# Prefer tf-igmf-release.yml (stackName=connectivity) or tf-Hub-Deployment.yml with envName=igmf.
# Requires AzDo variable group: tf-backend-igmf (uksouth only).

trigger: none

parameters:
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: hubSelection
    displayName: Hubs to manage
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: igmf
      location: ${{ parameters.location }}

stages:
  - template: templates/connectivity-stages.yml
    parameters:
      envName: igmf
      location: ${{ parameters.location }}
      azureServiceConnection: $(azureServiceConnection)
      agentPool: $(agentPool)
      tfBackendResourceGroup: $(tfBackendResourceGroup)
      tfBackendStorageAccount: $(tfBackendStorageAccount)
      tfBackendContainer: $(tfBackendContainer)
      action: ${{ parameters.action }}
      hubSelection: ${{ parameters.hubSelection }}
      seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}
