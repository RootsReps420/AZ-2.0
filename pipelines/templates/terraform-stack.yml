# Reusable Terraform stack job (Phase H)
# Expects Azure service connection + backend storage params.
#
# Auth: AzureCLI@2 logs in as the service connection SP. azurerm refuses CLI auth
# for service principals — export ARM_* and disable CLI auth (ARM_USE_CLI=false).
#
# Hub selection (connectivity only): pass enableHub01/enableHub02 explicitly for
# staged Hub01→Hub02 applies, or hubSelection (both|hub01|hub02) to derive flags.
# Destroy never passes hub -vars (full stack teardown); always passes -var=location.
#
# location=uksouth: workdir environments/<env>/<stack>, state <env>/<stack>.tfstate
# location=italynorth|spaincentral: workdir environments/<env>/<location>/<stack>,
#   state <env>/<location>/<stack>.tfstate (vwan workdir always config/vwan)

parameters:
  - name: envName
    type: string
  - name: location
    type: string
    default: uksouth
  - name: stackName
    type: string
  - name: azureServiceConnection
    type: string
  - name: agentPool
    type: string
  - name: tfBackendResourceGroup
    type: string
  - name: tfBackendStorageAccount
    type: string
  - name: tfBackendContainer
    type: string
    default: tfstate
  - name: terraformVersion
    type: string
    default: "1.9.0"
  - name: action
    type: string
    default: apply # plan | apply | destroy
  - name: workingDirectory
    type: string
    default: ""
  - name: seedIgmfTfvars
    type: boolean
    default: false
  # Human label for job displayName (e.g. "Hub01 secured + firewall policy")
  - name: stageLabel
    type: string
    default: ""
  # Multiline bullet list of what this run manages (shown in scope banner)
  - name: scopeManifest
    type: string
    default: ""
  # Connectivity hub selection — used when enableHub01/02 are empty
  - name: hubSelection
    type: string
    default: both # both | hub01 | hub02
  # Explicit hub flags for staged applies (true/false/empty). Empty = derive from hubSelection.
  - name: enableHub01
    type: string
    default: ""
  - name: enableHub02
    type: string
    default: ""

jobs:
  - job: terraform_${{ parameters.envName }}_${{ parameters.location }}_${{ parameters.stackName }}
    displayName: ${{ coalesce(parameters.stageLabel, format('TF {0} {1}/{2}/{3}', parameters.action, parameters.envName, parameters.location, parameters.stackName)) }}
    pool:
      name: ${{ parameters.agentPool }}
    variables:
      ${{ if ne(parameters.workingDirectory, '') }}:
        stackDir: ${{ parameters.workingDirectory }}
      ${{ elseif eq(parameters.stackName, 'vwan') }}:
        stackDir: config/vwan
      ${{ elseif eq(parameters.location, 'uksouth') }}:
        stackDir: environments/${{ parameters.envName }}/${{ parameters.stackName }}
      ${{ else }}:
        stackDir: environments/${{ parameters.envName }}/${{ parameters.location }}/${{ parameters.stackName }}
      ${{ if eq(parameters.location, 'uksouth') }}:
        stateKey: ${{ parameters.envName }}/${{ parameters.stackName }}.tfstate
      ${{ else }}:
        stateKey: ${{ parameters.envName }}/${{ parameters.location }}/${{ parameters.stackName }}.tfstate
      # Resolve hub flags for connectivity plan/apply
      ${{ if ne(parameters.enableHub01, '') }}:
        resolvedEnableHub01: ${{ parameters.enableHub01 }}
      ${{ elseif eq(parameters.hubSelection, 'hub02') }}:
        # Additive Hub02 stage: keep Hub01 so it is not destroyed
        resolvedEnableHub01: "true"
      ${{ elseif eq(parameters.hubSelection, 'hub01') }}:
        resolvedEnableHub01: "true"
      ${{ else }}:
        resolvedEnableHub01: "true"
      ${{ if ne(parameters.enableHub02, '') }}:
        resolvedEnableHub02: ${{ parameters.enableHub02 }}
      ${{ elseif eq(parameters.hubSelection, 'hub01') }}:
        resolvedEnableHub02: "false"
      ${{ else }}:
        resolvedEnableHub02: "true"
    steps:
      - checkout: self

      - task: Bash@3
        displayName: Deployment scope banner
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            echo "=== Deployment scope ==="
            echo "Env      : ${{ parameters.envName }}"
            echo "Location : ${{ parameters.location }}"
            echo "Stack    : ${{ parameters.stackName }}"
            echo "Action   : ${{ parameters.action }}"
            echo "State    : $(stateKey)"
            echo "Workdir  : $(stackDir)"
            echo "SC       : ${{ parameters.azureServiceConnection }}"
            echo "Agent    : ${{ parameters.agentPool }}"
            if [ "${{ parameters.location }}" != "uksouth" ]; then
              echo "##vso[task.logissue type=warning]location=${{ parameters.location }} — regional lab is a placeholder. SC '${{ parameters.azureServiceConnection }}' and workdir are stubs until the region lab exists."
            fi
            if [ "${{ parameters.stackName }}" = "connectivity" ] && [ "${{ parameters.action }}" != "destroy" ]; then
              echo "Hub flags: enable_hub01=$(resolvedEnableHub01) enable_hub02=$(resolvedEnableHub02) (hubSelection=${{ parameters.hubSelection }})"
              if [ "${{ parameters.hubSelection }}" != "both" ] && [ -z "${{ parameters.enableHub01 }}${{ parameters.enableHub02 }}" ]; then
                echo "##vso[task.logissue type=warning]hubSelection=${{ parameters.hubSelection }} — narrowing hubs can destroy deselected hubs if they already exist in state."
              fi
            fi
            if [ -n "${{ parameters.scopeManifest }}" ]; then
              echo ""
              echo "Will deploy / manage:"
              printf '%s\n' "${{ parameters.scopeManifest }}"
            fi
            echo "========================"

      - task: Bash@3
        displayName: Seed IGMF terraform.tfvars from examples
        condition: and(succeeded(), eq('${{ parameters.seedIgmfTfvars }}', true))
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            ROOT="$(Build.SourcesDirectory)"
            if [ "${{ parameters.stackName }}" = "vwan" ]; then
              SRC="${ROOT}/environments/igmf/global.tfvars.example"
              DST="${ROOT}/config/vwan/terraform.tfvars"
            else
              SRC="${ROOT}/$(stackDir)/terraform.tfvars.example"
              DST="${ROOT}/$(stackDir)/terraform.tfvars"
            fi
            if [ ! -f "${SRC}" ]; then
              echo "##vso[task.logissue type=error]Missing tfvars example: ${SRC}"
              exit 1
            fi
            cp "${SRC}" "${DST}"
            echo "Seeded ${DST} from ${SRC}"

      - task: TerraformInstaller@1
        displayName: Install Terraform
        inputs:
          terraformVersion: ${{ parameters.terraformVersion }}

      # Capture SP creds once, then clear az CLI so terraform never uses CLI auth.
      - task: AzureCLI@2
        name: armcreds
        displayName: Export ARM credentials for Terraform
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [ -z "${servicePrincipalId:-}" ] || [ -z "${servicePrincipalKey:-}" ] || [ -z "${tenantId:-}" ]; then
              echo "##vso[task.logissue type=error]addSpnToEnvironment did not populate SPN vars. Service connection must be 'Service principal (manual)' with a client secret (not WIF-only)."
              exit 1
            fi
            SUB_ID="$(az account show --query id -o tsv)"
            echo "##vso[task.setvariable variable=ARM_CLIENT_ID;isOutput=true;issecret=true]${servicePrincipalId}"
            echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;isOutput=true;issecret=true]${servicePrincipalKey}"
            echo "##vso[task.setvariable variable=ARM_TENANT_ID;isOutput=true;issecret=true]${tenantId}"
            echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID;isOutput=true]${SUB_ID}"
            echo "ARM credentials captured for subscription ${SUB_ID}"

      - task: Bash@3
        displayName: Terraform init
        env:
          ARM_CLIENT_ID: $(armcreds.ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(armcreds.ARM_CLIENT_SECRET)
          ARM_TENANT_ID: $(armcreds.ARM_TENANT_ID)
          ARM_SUBSCRIPTION_ID: $(armcreds.ARM_SUBSCRIPTION_ID)
          ARM_USE_CLI: "false"
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)/$(stackDir)
          script: |
            set -euo pipefail
            terraform init -input=false \
              -backend-config="resource_group_name=${{ parameters.tfBackendResourceGroup }}" \
              -backend-config="storage_account_name=${{ parameters.tfBackendStorageAccount }}" \
              -backend-config="container_name=${{ parameters.tfBackendContainer }}" \
              -backend-config="key=$(stateKey)"

      - task: Bash@3
        displayName: Terraform validate
        env:
          ARM_CLIENT_ID: $(armcreds.ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(armcreds.ARM_CLIENT_SECRET)
          ARM_TENANT_ID: $(armcreds.ARM_TENANT_ID)
          ARM_SUBSCRIPTION_ID: $(armcreds.ARM_SUBSCRIPTION_ID)
          ARM_USE_CLI: "false"
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)/$(stackDir)
          script: |
            set -euo pipefail
            terraform validate

      - task: Bash@3
        displayName: Terraform plan
        condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
        env:
          ARM_CLIENT_ID: $(armcreds.ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(armcreds.ARM_CLIENT_SECRET)
          ARM_TENANT_ID: $(armcreds.ARM_TENANT_ID)
          ARM_SUBSCRIPTION_ID: $(armcreds.ARM_SUBSCRIPTION_ID)
          ARM_USE_CLI: "false"
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)/$(stackDir)
          script: |
            set -euo pipefail
            EXTRA_VARS=(-var="location=${{ parameters.location }}")
            if [ "${{ parameters.stackName }}" = "connectivity" ]; then
              EXTRA_VARS+=(-var="enable_hub01=$(resolvedEnableHub01)")
              EXTRA_VARS+=(-var="enable_hub02=$(resolvedEnableHub02)")
            fi
            echo "Plan with ${EXTRA_VARS[*]}"
            terraform plan -input=false "${EXTRA_VARS[@]}" -out=tfplan
            echo ""
            echo "=== Planned changes (summary) ==="
            terraform show -no-color tfplan | tail -n 80 || true

      - task: Bash@3
        displayName: Terraform apply
        condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
        env:
          ARM_CLIENT_ID: $(armcreds.ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(armcreds.ARM_CLIENT_SECRET)
          ARM_TENANT_ID: $(armcreds.ARM_TENANT_ID)
          ARM_SUBSCRIPTION_ID: $(armcreds.ARM_SUBSCRIPTION_ID)
          ARM_USE_CLI: "false"
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)/$(stackDir)
          script: |
            set -euo pipefail
            terraform apply -input=false -auto-approve tfplan

      - task: Bash@3
        displayName: Terraform destroy
        condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
        env:
          ARM_CLIENT_ID: $(armcreds.ARM_CLIENT_ID)
          ARM_CLIENT_SECRET: $(armcreds.ARM_CLIENT_SECRET)
          ARM_TENANT_ID: $(armcreds.ARM_TENANT_ID)
          ARM_SUBSCRIPTION_ID: $(armcreds.ARM_SUBSCRIPTION_ID)
          ARM_USE_CLI: "false"
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)/$(stackDir)
          script: |
            set -euo pipefail
            # Full stack destroy — do not pass hub enable flags; do pass location
            terraform destroy -input=false -auto-approve -var="location=${{ parameters.location }}"
