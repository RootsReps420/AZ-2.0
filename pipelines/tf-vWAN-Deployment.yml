# Shared Virtual WAN (_global). One stack per run.
# Apply before Hub / mgmt / labs / avd.
# envName=igmf seeds terraform.tfvars from environments/igmf/global.tfvars.example (uksouth only).
# location selects Azure region; _global workdir stays environments/_global for all locations.

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
      - igmf
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: ${{ parameters.envName }}
      location: ${{ parameters.location }}

stages:
  - stage: vwan
    displayName: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — Virtual WAN (_global)
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          location: ${{ parameters.location }}
          stackName: _global
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          workingDirectory: environments/_global
          seedIgmfTfvars: ${{ and(eq(parameters.envName, 'igmf'), eq(parameters.location, 'uksouth')) }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }}/${{ parameters.location }} — Virtual WAN
          scopeManifest: |
            - Shared Virtual WAN resource group
            - Virtual WAN (vdi platform)
