# AVD host pools, workspaces, scaling plans, gallery definitions, DCRs.
# Requires labs (+ connectivity / mgmt). Session-host VMs stay PowerShell.

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: azureServiceConnection
    ${{ if eq(parameters.envName, 'int') }}:
      value: SC-R-VDI-INT-C-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: SC-P-VDI-PRD-C-01
  - name: agentPool
    ${{ if eq(parameters.envName, 'int') }}:
      value: uks-int-vdi-mgmt-vss-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: uks-prd-vdi-mgmt-vss-01
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate

stages:
  - stage: avd
    displayName: ${{ parameters.action }} ${{ parameters.envName }} — AVD host pools / gallery
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          stackName: avd
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — AVD host pools
          scopeManifest: |
            - AVD resource group(s)
            - MSH host pools + workspace + scaling (+ decom siblings)
            - Optional PERS / PRIV host pools (feature flags in tfvars)
            - Compute gallery + image definitions (versions stay Packer)
            - MSH data collection rules
            - (Session-host VMs stay PowerShell — not in this stack)
