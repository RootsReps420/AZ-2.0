# IGMF sandbox release — one stack per run into ignitemyfire.co.uk.
# Deploy order: _global → connectivity → mgmt → labs → avd.
# Uses env-context for SC/agent (uksouth → IGMF SC; other locations → placeholders).
# Requires AzDo variable group: tf-backend-igmf (when location=uksouth).

trigger: none

parameters:
  - name: location
    displayName: Location
    type: string
    default: uksouth
    values:
      - uksouth
      - italynorth
      - spaincentral
  - name: stackName
    displayName: Stack
    type: string
    default: connectivity
    values:
      - _global
      - connectivity
      - mgmt
      - labs
      - avd
  - name: hubSelection
    displayName: Hubs (connectivity only)
    type: string
    default: both
    values:
      - both
      - hub01
      - hub02
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - template: templates/env-context.yml
    parameters:
      envName: igmf
      location: ${{ parameters.location }}

stages:
  - ${{ if eq(parameters.stackName, 'connectivity') }}:
    - template: templates/connectivity-stages.yml
      parameters:
        envName: igmf
        location: ${{ parameters.location }}
        azureServiceConnection: $(azureServiceConnection)
        agentPool: $(agentPool)
        tfBackendResourceGroup: $(tfBackendResourceGroup)
        tfBackendStorageAccount: $(tfBackendStorageAccount)
        tfBackendContainer: $(tfBackendContainer)
        action: ${{ parameters.action }}
        hubSelection: ${{ parameters.hubSelection }}
        seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}

  - ${{ if eq(parameters.stackName, '_global') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/${{ parameters.location }}/_global — Virtual WAN
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            location: ${{ parameters.location }}
            stackName: _global
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            workingDirectory: environments/_global
            seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}
            stageLabel: ${{ parameters.action }} igmf/${{ parameters.location }} — Virtual WAN
            scopeManifest: |
              - Shared Virtual WAN resource group
              - Virtual WAN (IGMF sandbox)

  - ${{ if eq(parameters.stackName, 'mgmt') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/${{ parameters.location }}/mgmt
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            location: ${{ parameters.location }}
            stackName: mgmt
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}
            stageLabel: ${{ parameters.action }} igmf/${{ parameters.location }} — management
            scopeManifest: |
              - Management resource group
              - Log Analytics + mgmt spoke + alerts

  - ${{ if eq(parameters.stackName, 'labs') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/${{ parameters.location }}/labs
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            location: ${{ parameters.location }}
            stackName: labs
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}
            stageLabel: ${{ parameters.action }} igmf/${{ parameters.location }} — AVD labs
            scopeManifest: |
              - Lab spokes + optional FSLogix / KVs / blob

  - ${{ if eq(parameters.stackName, 'avd') }}:
    - stage: terraform
      displayName: ${{ parameters.action }} igmf/${{ parameters.location }}/avd
      jobs:
        - template: templates/terraform-stack.yml
          parameters:
            envName: igmf
            location: ${{ parameters.location }}
            stackName: avd
            azureServiceConnection: $(azureServiceConnection)
            agentPool: $(agentPool)
            tfBackendResourceGroup: $(tfBackendResourceGroup)
            tfBackendStorageAccount: $(tfBackendStorageAccount)
            tfBackendContainer: $(tfBackendContainer)
            action: ${{ parameters.action }}
            seedIgmfTfvars: ${{ eq(parameters.location, 'uksouth') }}
            stageLabel: ${{ parameters.action }} igmf/${{ parameters.location }} — AVD host pools
            scopeManifest: |
              - Host pools / gallery definitions / DCRs
