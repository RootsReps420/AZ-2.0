# AVD lab spokes + storage (PERS / MSH / PRIV, FSLogix, lab KVs). Requires connectivity + mgmt.

trigger: none

parameters:
  - name: envName
    displayName: Environment
    type: string
    default: int
    values:
      - int
      - prd
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: azureServiceConnection
    ${{ if eq(parameters.envName, 'int') }}:
      value: SC-R-VDI-INT-C-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: SC-P-VDI-PRD-C-01
  - name: agentPool
    ${{ if eq(parameters.envName, 'int') }}:
      value: uks-int-vdi-mgmt-vss-01
    ${{ if eq(parameters.envName, 'prd') }}:
      value: uks-prd-vdi-mgmt-vss-01
  - name: tfBackendResourceGroup
    value: $(tf.backend.resourceGroup)
  - name: tfBackendStorageAccount
    value: $(tf.backend.storageAccount)
  - name: tfBackendContainer
    value: tfstate

stages:
  - stage: labs
    displayName: ${{ parameters.action }} ${{ parameters.envName }} — AVD labs (spokes / storage)
    jobs:
      - template: templates/terraform-stack.yml
        parameters:
          envName: ${{ parameters.envName }}
          stackName: labs
          azureServiceConnection: $(azureServiceConnection)
          agentPool: $(agentPool)
          tfBackendResourceGroup: $(tfBackendResourceGroup)
          tfBackendStorageAccount: $(tfBackendStorageAccount)
          tfBackendContainer: $(tfBackendContainer)
          action: ${{ parameters.action }}
          stageLabel: ${{ parameters.action }} ${{ parameters.envName }} — AVD labs
          scopeManifest: |
            - PERS / MULT (/ PRIV) lab resource groups
            - PERS spokes → Hub01
            - MSH spokes → Hub01 + Hub02 dual-hub UDRs
            - Optional FSLogix storage accounts / shares / CMK (enable_fslogix)
            - Optional lab Key Vaults (enable_lab_keyvaults)
            - Optional PERS blob STAs (enable_pers_blob)
            - NSG rules as defined in the labs root
